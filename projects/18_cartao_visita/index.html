    <style>
      /* ========= RESET ========= */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ========= VARIABLES ========= */

      :root {
        --color-background: #071a1f;
        --color-surface: #0d2930;
        --color-surface-light: #123943;
        --color-primary: #38a19c;
        --color-primary-light: #5cb7d0;
        --color-text: #f1f7f8;
        --color-text-muted: #9bb6bc;
        --color-border: rgba(56, 161, 156, 0.45);
        --color-shadow: rgba(0, 0, 0, 0.45);
      }

      /* ========= BASE ========= */

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;

        font-family: Arial, sans-serif;
        color: var(--color-text);

        background:
          radial-gradient(
            circle at top left,
            rgba(56, 161, 156, 0.15),
            transparent 35%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(92, 183, 208, 0.1),
            transparent 35%
          ),
          var(--color-background);
      }

      a {
        color: inherit;
      }

      /* ========= HEADER ========= */

      header {
        padding: 24px 16px;
        text-align: center;

        border-bottom: 1px solid var(--color-border);
        background: rgba(7, 26, 31, 0.85);
      }

      .header-title {
        color: var(--color-primary-light);
        font-size: clamp(1.2rem, 3vw, 1.8rem);
        font-weight: bold;
        letter-spacing: 0.12rem;
        text-transform: uppercase;
      }

      /* ========= MAIN ========= */

      main {
        width: 100%;
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;

        padding: 60px 20px;
      }

      .business-card {
        width: min(100%, 900px);

        display: grid;
        grid-template-columns: 0.9fr 1.1fr;

        overflow: hidden;

        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 24px;

        box-shadow:
          0 20px 50px var(--color-shadow),
          0 0 30px rgba(56, 161, 156, 0.08);
      }

      /* ========= PROFILE ========= */

      .profile {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        padding: 50px 30px;

        text-align: center;

        background: linear-gradient(
          145deg,
          var(--color-surface-light),
          var(--color-surface)
        );

        border-right: 1px solid var(--color-border);
      }

      .profile-icon {
        width: 120px;
        height: 120px;

        margin-bottom: 25px;

        object-fit: contain;

        filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.4));
      }

      .profile-photo {
        width: 130px;
        height: 130px;

        margin-bottom: 20px;

        object-fit: cover;

        border: 3px solid var(--color-primary);
        border-radius: 50%;

        box-shadow:
          0 0 0 6px rgba(56, 161, 156, 0.1),
          0 10px 25px rgba(0, 0, 0, 0.35);

        transition:
          transform 0.3s ease,
          border-color 0.3s ease;
      }

      .profile-photo:hover {
        transform: scale(1.05);
        border-color: var(--color-primary-light);
      }

      .profile-name {
        margin-bottom: 8px;

        color: var(--color-primary-light);

        font-size: 2rem;
        font-weight: bold;
      }

      .profile-role {
        color: var(--color-text-muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .profile-code {
        margin-top: 25px;

        color: var(--color-primary);
        font-size: 2rem;
      }

      /* ========= INFORMATION ========= */

      .information {
        padding: 40px;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 10px;

        margin-bottom: 20px;

        color: var(--color-primary-light);

        font-size: 1.4rem;
      }

      .details {
        width: 100%;
        border-collapse: collapse;
      }

      .details tr {
        border-bottom: 1px solid rgba(56, 161, 156, 0.15);
      }

      .details tr:last-child {
        border-bottom: none;
      }

      .details td {
        padding: 14px 8px;
        vertical-align: top;
      }

      .details td:first-child {
        width: 35%;

        color: var(--color-text-muted);
        font-weight: bold;
      }

      .details td:last-child {
        color: var(--color-text);
      }

      .details i {
        margin-left: 6px;
        color: var(--color-primary);
      }

      /* ========= SOCIAL ========= */

      .social {
        margin-top: 35px;
        padding-top: 25px;

        border-top: 1px solid var(--color-border);
      }

      .social-links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;

        list-style: none;
      }

      .social-links a {
        width: 46px;
        height: 46px;

        display: flex;
        justify-content: center;
        align-items: center;

        color: var(--color-text);
        background: var(--color-surface-light);

        border: 1px solid var(--color-border);
        border-radius: 50%;

        text-decoration: none;

        transition:
          transform 0.3s ease,
          background-color 0.3s ease,
          color 0.3s ease;
      }

      .social-links a:hover {
        transform: translateY(-4px);

        color: var(--color-background);
        background: var(--color-primary);
      }

      .social-links i {
        font-size: 1.2rem;
      }

      /* ========= FOOTER ========= */

      footer {
        padding: 20px;

        color: var(--color-text-muted);

        text-align: center;

        border-top: 1px solid var(--color-border);
        background: #051317;
      }

      footer small {
        font-size: 0.8rem;
      }

      /* ========= RESPONSIVE ========= */

      @media (max-width: 768px) {
        main {
          padding: 40px 16px;
        }

        .business-card {
          grid-template-columns: 1fr;
        }

        .profile {
          border-right: none;
          border-bottom: 1px solid var(--color-border);
        }

        .information {
          padding: 30px 24px;
        }
      }

      @media (max-width: 480px) {
        .profile {
          padding: 40px 20px;
        }

        .information {
          padding: 25px 18px;
        }

        .profile-name {
          font-size: 1.7rem;
        }

        .details td {
          padding: 12px 5px;
          font-size: 0.9rem;
        }

        .details td:first-child {
          width: 30%;
        }
      }
    </style>
  </head>

      </article>
