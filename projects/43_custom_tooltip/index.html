<!doctype html>
<html lang="pt-BR">
  <head>
    <title>43 - Tooltip Personalizado</title>
    <meta charset="UTF-8" />
    <meta name="author" content="Alan Ryan da Silva Domingues" />
    <meta
      name="description"
      content="Projeto de tooltip personalizado com HTML, CSS e JavaScript, exibindo nomes dos personagens Gintoki, Kagura e Shinpachi ao passar o mouse sobre suas imagens."
    />
    <meta
      name="keywords"
      content="tooltip personalizado, HTML, CSS, JavaScript, efeito hover, tooltip interativo, Gintoki, Kagura, Shinpachi, Gintama"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Refresh" content="25; ../44" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="box">
        <img src="./assets/images/gintoki.jpeg" />
        <span class="tooltip">Gintoki</span>
      </div>
      <div class="box">
        <img src="./assets/images/kagura.jpg" />
        <span class="tooltip">Kagura</span>
      </div>
      <div class="box">
        <img src="./assets/images/shinpachi.jpeg" />
        <span class="tooltip">Shinpachi</span>
      </div>
    </div>
    <script src="./scripts/script.js"></script>
  </body>
</html>
