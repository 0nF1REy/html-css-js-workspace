<!doctype html>
<html lang="pt-BR">
  <head>
    <title>09 - Imagens</title>
    <meta charset="UTF-8" />
    <meta name="author" content="Alan Ryan da Silva Domingues" />
    <meta
      name="description"
      content="Estudo de imagens com HTML e CSS, explorando imagens de bandas musicais, capas de álbuns, organização visual, responsividade e efeitos de interação."
    />
    <meta
      name="keywords"
      content="Imagens, Bandas Musicais, Capas de Álbuns, ELP, Os Mutantes, Queen, REO Speedwagon, CSS, Responsividade"
    />
    <meta name="theme-color" content="#f0f8ff" />
    <meta http-equiv="refresh" content="25; ../10_interactive_cards" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {
        --background: #f0f8ff;
        --surface: #ffffff;
        --surface-light: #e6f2ff;
        --surface-hover: #d0ebff;

        --border: #b8d4e8;

        --text: #333333;
        --text-muted: #555555;

        --accent: #2a4d69;
        --accent-light: #397ba5;

        --radius: 10px;
        --shadow: 0 5px 18px rgb(42 77 105 / 10%);
      }

      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 40px;
        background: linear-gradient(to bottom, #f0f8ff, #e6f2ff);
        color: var(--text);
        line-height: 1.6;
      }

      header {
        padding: 10px 20px 0;
        text-align: center;
      }

      .header-title {
        margin: 0;
        color: var(--accent);
        font-size: clamp(1.5rem, 3vw, 2rem);
        font-weight: 700;
        text-shadow: 1px 1px 2px rgb(0 0 0 / 10%);
      }

      .header-subtitle {
        display: block;
        margin-top: 10px;
        color: var(--text-muted);
        font-size: 0.85rem;
        font-style: italic;
      }

      .divider {
        width: 80%;
        margin: 20px auto;
        border: 1px solid #aaa;
      }

      main {
        display: grid;
        gap: 28px;
        width: min(100%, 1100px);
        margin: 0 auto;
        padding: 20px 0;
      }

      .gallery-section {
        min-width: 0;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .section-title {
        margin: 0;
        padding: 15px;
        background: linear-gradient(110deg, #2a4d69, #397ba5);
        color: #ffffff;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-align: center;
      }

      .gallery-content {
        padding: 25px;
      }

      .band-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }

      .album-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
      }

      .gallery-item {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        background: var(--surface-light);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        transition:
          transform 250ms ease,
          border-color 250ms ease,
          box-shadow 250ms ease;
      }

      .gallery-item:hover {
        transform: translateY(-4px);
        border-color: var(--accent-light);
        box-shadow: 0 8px 22px rgb(42 77 105 / 15%);
      }

      .gallery-image {
        display: block;
        width: 100%;
        object-fit: cover;
        transition: transform 300ms ease;
      }

      .gallery-item:hover .gallery-image {
        transform: scale(1.04);
      }

      .band-image {
        aspect-ratio: 16 / 9;
      }

      .album-image {
        aspect-ratio: 1;
      }

      figcaption {
        min-height: 65px;
        padding: 12px;
        color: var(--text-muted);
        text-align: center;
      }

      .image-title {
        display: block;
        color: var(--accent);
        font-size: 0.85rem;
        font-weight: 700;
      }

      .image-description {
        display: block;
        margin-top: 3px;
        font-size: 0.75rem;
      }

      @media (max-width: 760px) {
        body {
          padding: 28px 20px;
        }

        .gallery-content {
          padding: 20px;
        }

        .album-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .band-grid {
          gap: 16px;
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 24px 12px;
        }

        header {
          padding: 5px 10px 0;
        }

        .gallery-content {
          padding: 15px;
        }

        .band-grid {
          grid-template-columns: 1fr;
        }

        .album-grid {
          gap: 12px;
        }

        figcaption {
          min-height: 60px;
          padding: 10px 5px;
        }

        .image-title {
          font-size: 0.78rem;
        }

        .image-description {
          font-size: 0.7rem;
        }

        .header-subtitle {
          font-size: 0.75rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }

        .gallery-item:hover {
          transform: none;
        }

        .gallery-item:hover .gallery-image {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1 class="header-title">Módulo de HTML</h1>

      <span class="header-subtitle">
        Realizado por Alan Ryan na data de 21 de setembro de 2024.
      </span>

      <hr class="divider" />
    </header>

    <main>
      <section class="gallery-section">
        <h2 class="section-title">Bandas Musicais</h2>

        <div class="gallery-content">
          <div class="band-grid">
            <figure class="gallery-item">
              <img
                class="gallery-image band-image"
                src="./assets/images/elp.jpg"
                alt="Integrantes da banda Emerson, Lake and Palmer"
                loading="lazy"
                decoding="async"
              />

              <figcaption>
                <span class="image-title">Emerson, Lake and Palmer</span>
                <span class="image-description">Rock progressivo</span>
              </figcaption>
            </figure>

            <figure class="gallery-item">
              <img
                class="gallery-image band-image"
                src="./assets/images/os-mutantes.webp"
                alt="Integrantes da banda brasileira Os Mutantes"
                loading="lazy"
                decoding="async"
              />

              <figcaption>
                <span class="image-title">Os Mutantes</span>
                <span class="image-description">Rock psicodélico</span>
              </figcaption>
            </figure>

            <figure class="gallery-item">
              <img
                class="gallery-image band-image"
                src="./assets/images/queen.webp"
                alt="Integrantes da banda Queen"
                loading="lazy"
                decoding="async"
              />

              <figcaption>
                <span class="image-title">Queen</span>
                <span class="image-description">Rock</span>
              </figcaption>
            </figure>

            <figure class="gallery-item">
              <img
                class="gallery-image band-image"
                src="./assets/images/reo-speedwagon.jpg"
                alt="Integrantes da banda REO Speedwagon"
                loading="lazy"
                decoding="async"
              />

              <figcaption>
                <span class="image-title">REO Speedwagon</span>
                <span class="image-description">Rock</span>
              </figcaption>
            </figure>
          </div>
        </div>
      </section>

      <section class="gallery-section">
        <h2 class="section-title">Capas de Álbuns</h2>

        <div class="gallery-content">
          <div class="album-grid">
            <figure class="gallery-item">
              <img
                class="gallery-image album-image"
                src="./assets/images/a-night-at-the-opera.jpeg"
                alt="Capa do álbum A Night at the Opera, do Queen"
                loading="lazy"
                decoding="async"
              />

              <figcaption>
                <span class="image-title">A Night at the Opera</span>
                <span class="image-description">Queen</span>
              </figcaption>
            </figure>

            <figure class="gallery-item">
              <img
                class="gallery-image album-image"
                src="./assets/images/Brain-Salad-Surgery.jpeg"
                alt="Capa do álbum Brain Salad Surgery, do Emerson, Lake and Palmer"
                loading="lazy"
                decoding="async"
              />

              <figcaption>
                <span class="image-title">Brain Salad Surgery</span>
                <span class="image-description">Emerson, Lake and Palmer</span>
              </figcaption>
            </figure>

            <figure class="gallery-item">
              <img
                class="gallery-image album-image"
                src="./assets/images/Tudo-foi-feito-pelo-Sol.jpeg"
                alt="Capa do álbum Tudo Foi Feito Pelo Sol, de Os Mutantes"
                loading="lazy"
                decoding="async"
              />

              <figcaption>
                <span class="image-title">Tudo Foi Feito Pelo Sol</span>
                <span class="image-description">Os Mutantes</span>
              </figcaption>
            </figure>

            <figure class="gallery-item">
              <img
                class="gallery-image album-image"
                src="./assets/images/Wheels-Are-Turnin.jpeg"
                alt="Capa do álbum Wheels Are Turnin', do REO Speedwagon"
                loading="lazy"
                decoding="async"
              />

              <figcaption>
                <span class="image-title">Wheels Are Turnin'</span>
                <span class="image-description">REO Speedwagon</span>
              </figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
