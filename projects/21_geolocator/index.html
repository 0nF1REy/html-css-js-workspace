<!doctype html>
<html lang="pt-BR">
  <head>
    <title>GeoLocator - Sistema de Gestão Geográfica</title>
    <meta charset="UTF-8" />
    <meta http-equiv="Refresh" content="25; ../22_christmas_gift" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>
    <div class="search-container">
      <div class="search-box">
        <i
          class="bi bi-geo-alt-fill"
          style="
            color: var(--gintama-cyan);
            font-size: 1.2rem;
            margin-left: 10px;
          "
        ></i>
        <input
          type="text"
          id="searchInput"
          placeholder="Digite o endereço ou local..."
          autocomplete="off"
        />
        <button class="btn-search" id="searchBtn">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </div>

    <div class="map-tag">GeoLocator</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="./scripts/script.js"></script>
  </body>
</html>
