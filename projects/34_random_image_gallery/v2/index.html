<!doctype html>

<html lang="pt-BR">
  <head>
    <title>34 - Galeria de Imagens Aleatórias</title>
    <meta charset="UTF-8" />
    <meta name="Author" content="Alan Ryan da Silva Domingues" />
    <!-- <meta http-equiv="Refresh" content="25; ../../00_hello_world/v1" /> -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <h1>Galeria de Imagens Aleatórias</h1>
        <p class="description">
          Explore uma coleção de imagens aleatórias em diferentes formatos e
          proporções.
        </p>
      </div>
    </header>

    <main class="main">
      <section class="gallery-section" aria-labelledby="gallery-title">
        <div class="section-heading">
          <h2 id="gallery-title">Galeria</h2>
          <p>Novas imagens são adicionadas a cada carregamento.</p>
        </div>

        <div class="image-container">
          <img
            src="https://picsum.photos/500/500?random=1"
            alt="Imagem aleatória"
            width="500"
            height="500"
          />

          <img
            src="https://picsum.photos/600/450?random=2"
            alt="Imagem aleatória"
            width="600"
            height="450"
          />

          <img
            src="https://picsum.photos/450/600?random=3"
            alt="Imagem aleatória"
            width="450"
            height="600"
          />

          <img
            src="https://picsum.photos/600/500?random=4"
            alt="Imagem aleatória"
            width="600"
            height="500"
          />
        </div>

        <button class="btn" type="button">Carregar Mais Imagens</button>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Galeria de Imagens Aleatórias</p>
    </footer>

    <script src="./scripts/script.js"></script>
  </body>
</html>
