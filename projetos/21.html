<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Google Maps Alternativo</title>
    <meta charset="UTF-8" />
    <meta name="Author" content="Alan Ryan da Silva Domingues" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Refresh" content="25; 01.html" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #map {
        height: 100%;
        width: 100%;
      }
      .search-bar {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2000;
        width: 100%;
        max-width: 600px;
        padding: 0 12px;
      }
    </style>
  </head>

  <body>
    <div class="search-bar">
      <div class="input-group">
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="Busque por um local..."
        />
        <button class="btn btn-primary" id="searchBtn">Buscar</button>
      </div>
    </div>

    <div id="map"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <script>
      const map = L.map("map").setView([-23.9822, -48.8756], 15);

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      let marcacaoAtual = null;

      async function buscarLocal() {
        const query = document.getElementById("searchInput").value.trim();
        if (!query) return;

        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;

        try {
          const response = await fetch(url, {
            headers: { "Accept-Language": "pt-BR" },
          });
          const results = await response.json();

          if (results.length > 0) {
            const { lat, lon, display_name } = results[0];
            const latitude = Number(lat);
            const longitude = Number(lon);

            if (marcacaoAtual) map.removeLayer(marcacaoAtual);

            marcacaoAtual = L.marker([latitude, longitude])
              .addTo(map)
              .bindPopup(display_name)
              .openPopup();

            map.setView([latitude, longitude], 14);
          } else {
            alert("Nenhum local encontrado!");
          }
        } catch {
          alert("Erro ao buscar local");
        }
      }

      document
        .getElementById("searchBtn")
        .addEventListener("click", buscarLocal);

      document
        .getElementById("searchInput")
        .addEventListener("keydown", (e) => {
          if (e.key === "Enter") buscarLocal();
        });
    </script>
  </body>
</html>
